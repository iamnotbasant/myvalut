    fill-opacity="0.95"
  />

  <!-- Security Nodes -->
  <circle cx="24" cy="10" r="1.25" fill="#38BDF8" />
  <circle cx="35" cy="18" r="1.25" fill="#6366F1" />
  <circle cx="13" cy="18" r="1.25" fill="#38BDF8" />
