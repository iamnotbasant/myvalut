<svg width="64" height="64" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="valut_bg" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1E1E24" />
      <stop offset="50%" stopColor="#121216" />
      <stop offset="100%" stopColor="#0A0A0D" />
    </linearGradient>
    <linearGradient id="valut_accent" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#6366F1" />
      <stop offset="100%" stopColor="#A855F7" />
    </linearGradient>
    <linearGradient id="valut_bevel" x1="24" y1="4" x2="24" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.25" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Vault Outer Shell -->
  <path
    d="M24 3.5L41.5 13.5V33.5L24 43.5L6.5 33.5V13.5L24 3.5Z"
